name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 构建与检查
    # macos-latest = macOS 26 Arm64，与本机工具链一致
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: 单元测试
        run: swift test

      - name: 选区逻辑检查
        run: zsh scripts/check-selection.sh

      - name: 贴图检查
        run: zsh scripts/check-pin.sh

      - name: 录屏导出检查
        run: zsh scripts/check-recording.sh

      - name: 发布构建
        run: zsh scripts/build.sh
